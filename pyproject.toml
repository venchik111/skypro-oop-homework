[tool.poetry]
name = "skypro-oop-homework"
version = "0.1.0"
description = "Учебное ядро интернет-магазина"
authors = ["Ivan <venchik6767@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
flake8 = ">=7,<8"
black = ">=25,<27"
isort = ">=6,<8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-report=xml:coverage.xml --cov-fail-under=76"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119
